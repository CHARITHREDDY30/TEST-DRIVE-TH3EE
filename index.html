    <!-- Single Page App Redirect Restore & Base Href Anchor for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        var pathname = l.pathname || '/';
        var match = pathname.match(/^(\/[^\/]+)/);
        var isTestDrive = match && match[1].toLowerCase() === '/test-drive-th3ee';
        var basePath = isTestDrive ? match[1] + '/' : '/';
        document.write('<base href="' + basePath + '">');

        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              (isTestDrive ? match[1] : '') + decoded + l.hash
          );
        }
      }(window.location));
    </script>
