<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #FAFAFA;
        color: #171717;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #FFFFFF;
        border: 2px solid #171717;
        max-width: 520px;
        width: 100%;
        padding: 48px 36px;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      }
      .badge {
        display: inline-block;
        background: #E51E2B;
        color: #FFFFFF;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 4px 12px;
        margin-bottom: 24px;
        font-family: monospace;
      }
      .code {
        font-size: 72px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        font-family: 'Montserrat', sans-serif;
        color: #171717;
        margin-bottom: 8px;
      }
      .divider {
        width: 48px;
        height: 4px;
        background: #E51E2B;
        margin: 0 auto 24px auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #525252;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn-primary {
        background: #171717;
        color: #FFFFFF;
        padding: 14px 24px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-decoration: none;
        transition: background 0.2s;
        font-family: monospace;
        display: block;
      }
      .btn-primary:hover {
        background: #E51E2B;
      }
      .btn-secondary {
        background: #FFFFFF;
        color: #171717;
        border: 1px solid #D4D4D4;
        padding: 12px 24px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-decoration: none;
        transition: border-color 0.2s;
        font-family: monospace;
        display: block;
      }
      .btn-secondary:hover {
        border-color: #171717;
      }
      .btn-row {
        display: flex;
        gap: 12px;
      }
      .btn-row > * { flex: 1; }
      @media (max-width: 480px) {
        .card { padding: 32px 20px; }
        .code { font-size: 56px; }
        h1 { font-size: 20px; }
        .btn-row { flex-direction: column; }
      }
    </style>
  </head>

      <div class="actions">
